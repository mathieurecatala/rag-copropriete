# Valeurs de développement uniquement (mot de passe local, aucune clé obligatoire).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: syndic
      POSTGRES_PASSWORD: syndic
      POSTGRES_DB: syndic
    volumes:
      - donnees:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syndic -d syndic"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    image: rag-copropriete-api:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://syndic:syndic@db:5432/syndic
      TEST_DATABASE_URL: postgresql://syndic:syndic@db:5432/syndic_test
      INGESTION_AU_DEMARRAGE: "1"
      # Facultatif : la réponse rédigée par Claude n'est activée que si la clé est fournie (fichier .env).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"   # local seulement : POST /ingestion n'a pas d'authentification

volumes:
  donnees:
